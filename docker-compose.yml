services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine # Uses a lightweight Postgres image
    container_name: grid-motors-db
    restart: always
    environment:
      POSTGRES_DB: grid_motors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data