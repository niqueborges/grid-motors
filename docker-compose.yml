services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: grid-motors-db
    restart: no
    environment:
      POSTGRES_DB: grid_motors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grid_motors"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- API Container ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grid-motors-api
    restart: no
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/grid_motors?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: sh -c "npx --yes prisma migrate deploy && npm run start:prod"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Redis Cache ---
  redis:
    image: redis:alpine
    container_name: grid-motors-redis
    restart: no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5