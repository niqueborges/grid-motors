services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: grid-motors-db
    restart: always
    environment:
      POSTGRES_DB: grid_motors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # --- API Container ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grid-motors-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: sh -c "npx --yes prisma migrate deploy && npm run start:prod"
    depends_on:
      - db
      - redis

  # --- Redis Cache ---
  redis:
    image: redis:alpine
    container_name: grid-motors-redis
    restart: always
    ports:
      - "6379:6379"